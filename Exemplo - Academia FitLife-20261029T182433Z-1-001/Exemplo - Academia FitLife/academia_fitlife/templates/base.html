<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}FitLife{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head>

<body>
    {% if session.get('uid') %}<header><a class="brand" href="{{ url_for('home') }}">FitLife <small>Gestão da
                Academia</small></a>
        <nav><a href="{{ url_for('home') }}">Painel</a><a href="{{ url_for('alunos') }}">Alunos</a><a
                href="{{ url_for('professores') }}">Professores</a><a href="{{ url_for('atividades') }}">Atividades</a>
            <form action="{{ url_for('logout') }}" method="post"><button class="navbtn">Sair</button></form>
        </nav>
    </header>{% endif %}
    <main class="container">{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div
            class="alert {{ cat }}">{{ msg }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
    <footer>Academia FitLife · MVP educacional</footer>
</body>

</html>
